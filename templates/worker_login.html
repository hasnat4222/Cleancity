{% extends "base.html" %}
{% block content %}

<section class="py-5">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5">
        <div class="card shadow-lg border-0 border-top border-success border-4">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-person-badge display-4 text-success"></i>
              <h3 class="fw-bold mt-2">Worker Portal</h3>
              <p class="text-muted">Enter your team code to access tasks</p>
            </div>
            <form method="POST">
              <div class="mb-4">
                <label class="form-label fw-bold">🔑 Team Code</label>
                <input type="password" name="team_code" class="form-control form-control-lg text-center" 
                       placeholder="Enter your secure team code" required>
              </div>
              <button type="submit" class="btn btn-success w-100 py-3 fw-bold">
                <i class="bi bi-box-arrow-in-right"></i> Access Tasks
              </button>
            </form>
            <div class="text-center mt-3">
              <small class="text-muted">Demo codes: muradpur123</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
